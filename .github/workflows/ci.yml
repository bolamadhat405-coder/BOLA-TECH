name: Build and typecheck

concurrency:
  group: bola-tech-ci-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Package source for review
        run: zip -r BOLA-TECH-review.zip . -x '.git/*' 'node_modules/*' '.next/*' '.vercel/*'
      - name: Upload review package
        uses: actions/upload-artifact@v4
        with:
          name: BOLA-TECH-review
          path: BOLA-TECH-review.zip
          if-no-files-found: error
          retention-days: 7
      - name: Install dependencies
        run: npm install
      - name: Validate Prisma schema
        run: npx prisma validate
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      - name: Build Next.js app
        run: npm run build
